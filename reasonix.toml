[permissions]
allow = [
  "Bash=cd phpserialize-solver && for f in tests/*.py; do sed -i \"s|sys.path.insert(0, '.')|sys.path.insert(0, '..')|g; s|sys.path.insert(0, os.path.dirname(__file__))|sys.path.insert(0, os.path.join(os.path.dirname(__file__), '..'))|g\" \"$f\"; done && echo \"done\"",
  "Bash=mv core.* _archived/ 2>&1 && echo \"根目录 core 文件已移动，数量: $(ls _archived/core.* 2>/dev/null | wc -l)\"",
  "Bash=find . -maxdepth 1 -name 'core.*' -exec mv {} _archived/ \\; && echo \"done: $(ls _archived/core.* 2>/dev/null | wc -l) files moved\"",
  "Bash=groups; sudo -n docker ps 2>&1 | head -3",
]
