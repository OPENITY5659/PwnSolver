name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pwntools capstone unicorn pyelftools ropgadget z3-solver

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Run module self-test
        run: python tests/verify_improvements.py

      - name: Compile entrypoints
        run: |
          python -m py_compile pwnsolver.py pwn_gui.py pwn_web.py check_env.py
          python -m py_compile pwn_solver/*.py
          python -m py_compile phpserialize-solver/*.py
