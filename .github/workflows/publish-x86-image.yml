name: publish-x86-image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-x86-image'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pwn-x86.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pwnsolver-x86:latest
            ghcr.io/${{ github.repository_owner }}/pwnsolver-x86:${{ github.sha }}

      - name: Login to Docker Hub (optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Hub (optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pwnsolver-x86:latest \
            ghcr.io/${{ github.repository_owner }}/pwnsolver-x86:latest
          docker buildx imagetools push ${{ secrets.DOCKERHUB_USERNAME }}/pwnsolver-x86:latest
